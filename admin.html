<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - Accessories Adda Hub</title>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  rel="stylesheet"
>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f9;
  font-family:Arial, sans-serif;
  color:#222;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#111,#333);
}

.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:35px;
  border-radius:18px;
  box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.login-box h2{
  text-align:center;
  font-weight:700;
  margin-bottom:10px;
}

.login-box p{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

/* DASHBOARD */

#dashboard{
  display:none;
}

.topbar{
  background:#111;
  color:#fff;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.topbar h4{
  margin:0;
}

.container-main{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

/* STAT CARDS */

.stat-card{
  background:#fff;
  border-radius:15px;
  padding:22px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
  height:100%;
}

.stat-title{
  color:#777;
  font-size:14px;
}

.stat-number{
  font-size:30px;
  font-weight:700;
  margin-top:5px;
}

/* SECTIONS */

.section-card{
  background:#fff;
  border-radius:15px;
  padding:25px;
  margin-top:25px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.section-title{
  font-size:22px;
  font-weight:700;
  margin-bottom:20px;
}

/* PRODUCT IMAGE */

.product-image{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}

/* TABLE */

.table-responsive{
  border-radius:12px;
}

table{
  vertical-align:middle;
}

/* PREVIEW */

.image-preview{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #ddd;
  display:none;
}

/* MOBILE */

@media(max-width:768px){

  .container-main{
    padding:12px;
  }

  .section-card{
    padding:15px;
  }

  .topbar{
    padding:12px;
  }

  .topbar h4{
    font-size:17px;
  }

  .stat-number{
    font-size:24px;
  }

  .login-box{
    padding:25px;
  }
}

/* LOADING */

.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:30px;
  color:#888;
}
</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage">

  <div class="login-box">

    <h2>Admin Login</h2>

    <p>Accessories Adda Hub</p>

    <div id="loginError" class="alert alert-danger d-none"></div>

    <label class="form-label">
      Admin Password
    </label>

    <input
      type="password"
      id="adminPass"
      class="form-control mb-3"
      placeholder="পাসওয়ার্ড লিখুন"
      autocomplete="off"
    >

    <button
      class="btn btn-dark w-100"
      onclick="loginAdmin()"
      id="loginButton"
    >
      Login
    </button>

  </div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div id="dashboard">

  <!-- TOP BAR -->

  <div class="topbar">

    <h4>
      Accessories Adda Hub - Admin
    </h4>

    <button
      class="btn btn-danger btn-sm"
      onclick="logout()"
    >
      Logout
    </button>

  </div>


  <div class="container-main">

    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="row g-3">

      <div class="col-6 col-lg-3">

        <div class="stat-card">

          <div class="stat-title">
            মোট পণ্য
          </div>

          <div
            class="stat-number"
            id="totalProducts"
          >
            0
          </div>

        </div>

      </div>


      <div class="col-6 col-lg-3">

        <div class="stat-card">

          <div class="stat-title">
            মোট অর্ডার
          </div>

          <div
            class="stat-number"
            id="totalOrders"
          >
            0
          </div>

        </div>

      </div>


      <div class="col-6 col-lg-3">

        <div class="stat-card">

          <div class="stat-title">
            Pending Order
          </div>

          <div
            class="stat-number"
            id="pendingOrders"
          >
            0
          </div>

        </div>

      </div>


      <div class="col-6 col-lg-3">

        <div class="stat-card">

          <div class="stat-title">
            মোট বিক্রি
          </div>

          <div
            class="stat-number"
            id="totalSales"
          >
            ৳0
          </div>

        </div>

      </div>

    </div>


    <!-- =========================
         PRODUCT MANAGEMENT
    ========================= -->

    <div class="section-card">

      <div class="section-title">
        🛍️ Product Management
      </div>


      <form id="productForm" onsubmit="saveProduct(event)">

        <input
          type="hidden"
          id="productId"
        >


        <div class="row g-3">

          <div class="col-md-6">

            <label class="form-label">
              Product Name
            </label>

            <input
              type="text"
              id="productName"
              class="form-control"
              required
            >

          </div>


          <div class="col-md-3">

            <label class="form-label">
              Sale Price
            </label>

            <input
              type="number"
              id="productPrice"
              class="form-control"
              min="0"
              required
            >

          </div>


          <div class="col-md-3">

            <label class="form-label">
              Regular Price
            </label>

            <input
              type="number"
              id="regularPrice"
              class="form-control"
              min="0"
            >

          </div>


          <div class="col-md-4">

            <label class="form-label">
              Stock
            </label>

            <input
              type="number"
              id="productStock"
              class="form-control"
              min="0"
              value="0"
            >

          </div>


          <div class="col-md-4">

            <label class="form-label">
              Category
            </label>

            <input
              type="text"
              id="productCategory"
              class="form-control"
              placeholder="Eyewear"
            >

          </div>


          <div class="col-md-4">

            <label class="form-label">
              SKU
            </label>

            <input
              type="text"
              id="productSku"
              class="form-control"
              placeholder="SKU-001"
            >

          </div>


          <div class="col-12">

            <label class="form-label">
              Product Description
            </label>

            <textarea
              id="productDescription"
              class="form-control"
              rows="4"
            ></textarea>

          </div>


          <div class="col-md-8">

            <label class="form-label">
              Product Image
            </label>

            <input
              type="file"
              id="productImageFile"
              class="form-control"
              accept="image/*"
              onchange="uploadImage(this)"
            >

            <input
              type="hidden"
              id="productImage"
            >

            <small
              class="text-muted"
              id="uploadStatus"
            ></small>

          </div>


          <div class="col-md-4">

            <img
              id="imagePreview"
              class="image-preview"
              alt="Preview"
            >

          </div>


          <div class="col-12">

            <div class="form-check">

              <input
                type="checkbox"
                class="form-check-input"
                id="productFeatured"
              >

              <label
                class="form-check-label"
                for="productFeatured"
              >
                Featured Product
              </label>

            </div>

          </div>


          <div class="col-12">

            <button
              type="submit"
              class="btn btn-success"
              id="saveProductButton"
            >
              Save Product
            </button>

            <button
              type="button"
              class="btn btn-secondary"
              onclick="resetProductForm()"
            >
              Reset
            </button>

          </div>

        </div>

      </form>

    </div>


    <!-- =========================
         PRODUCT LIST
    ========================= -->

    <div class="section-card">

      <div class="section-title">
        📦 All Products
      </div>

      <div
        id="productList"
        class="table-responsive"
      >

        <div class="loading">
          Loading products...
        </div>

      </div>

    </div>


    <!-- =========================
         ORDERS
    ========================= -->

    <div class="section-card">

      <div class="section-title">
        🧾 Order Management
      </div>

      <div
        id="orderList"
        class="table-responsive"
      >

        <div class="loading">
          Loading orders...
        </div>

      </div>

    </div>


    <!-- =========================
         WEBSITE SETTINGS
    ========================= -->

    <div class="section-card">

      <div class="section-title">
        ⚙️ Website Settings
      </div>


      <form onsubmit="saveSettings(event)">

        <div class="row g-3">

          <div class="col-md-6">

            <label class="form-label">
              Store Name
            </label>

            <input
              type="text"
              id="storeName"
              class="form-control"
            >

          </div>


          <div class="col-md-6">

            <label class="form-label">
              Tag Line
            </label>

            <input
              type="text"
              id="tagLine"
              class="form-control"
            >

          </div>


          <div class="col-md-6">

            <label class="form-label">
              WhatsApp Number
            </label>

            <input
              type="text"
              id="whatsapp"
              class="form-control"
            >

          </div>


          <div class="col-md-6">

            <label class="form-label">
              bKash Number
            </label>

            <input
              type="text"
              id="bkash"
              class="form-control"
            >

          </div>


          <div class="col-md-4">

            <label class="form-label">
              Currency
            </label>

            <input
              type="text"
              id="currency"
              class="form-control"
              value="৳"
            >

          </div>


          <div class="col-md-4">

            <label class="form-label">
              Delivery Inside Dhaka
            </label>

            <input
              type="number"
              id="deliveryInsideDhaka"
              class="form-control"
              min="0"
            >

          </div>


          <div class="col-md-4">

            <label class="form-label">
              Delivery Outside Dhaka
            </label>

            <input
              type="number"
              id="deliveryOutsideDhaka"
              class="form-control"
              min="0"
            >

          </div>


          <div class="col-md-6">

            <label class="form-label">
              Website Layout
            </label>

            <select
              id="layout"
              class="form-select"
            >

              <option value="grid-2">
                2 Products Per Row
              </option>

              <option value="grid-3">
                3 Products Per Row
              </option>

              <option value="grid-4">
                4 Products Per Row
              </option>

            </select>

          </div>


          <div class="col-md-6">

            <label class="form-label">
              Delivery Text
            </label>

            <input
              type="text"
              id="deliveryText"
              class="form-control"
            >

          </div>


          <div class="col-12">

            <label class="form-label">
              Logo URL
            </label>

            <input
              type="text"
              id="logo"
              class="form-control"
              placeholder="/uploads/logo.png"
            >

          </div>


          <div class="col-12">

            <button
              type="submit"
              class="btn btn-primary"
            >
              Save Website Settings
            </button>

          </div>

        </div>

      </form>

    </div>


    <!-- =========================
         CHANGE PASSWORD
    ========================= -->

    <div class="section-card">

      <div class="section-title">
        🔐 Change Admin Password
      </div>


      <form onsubmit="changePassword(event)">

        <div class="row g-3">

          <div class="col-md-6">

            <label class="form-label">
              Current Password
            </label>

            <input
              type="password"
              id="currentPassword"
              class="form-control"
              placeholder="বর্তমান পাসওয়ার্ড"
              autocomplete="off"
              required
            >

          </div>


          <div class="col-md-6">

            <label class="form-label">
              New Password
            </label>

            <input
              type="password"
              id="newPassword"
              class="form-control"
              placeholder="নতুন পাসওয়ার্ড"
              autocomplete="off"
              required
            >

          </div>


          <div class="col-12">

            <button
              type="submit"
              class="btn btn-warning"
            >
              Change Password
            </button>

          </div>

        </div>

      </form>

    </div>

  </div>

</div>


<script>

/* =========================================
   GLOBAL VARIABLES
========================================= */

let token = localStorage.getItem("adminToken") || "";

let products = [];
let orders = [];


/* =========================================
   AXIOS AUTH HEADER
========================================= */

function authConfig(){

  return {
    headers:{
      "x-admin-token": token
    }
  };

}


/* =========================================
   PAGE LOAD
========================================= */

document.addEventListener("DOMContentLoaded", function(){

  if(token){

    checkLogin();

  }

});


/* =========================================
   CHECK LOGIN
========================================= */

async function checkLogin(){

  try{

    await axios.get(
      "/api/admin/products",
      authConfig()
    );

    showDashboard();

  }catch(error){

    localStorage.removeItem("adminToken");

    token = "";

    showLogin();

  }

}


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

  document.getElementById("loginPage").style.display = "flex";

  document.getElementById("dashboard").style.display = "none";

}


/* =========================================
   SHOW DASHBOARD
========================================= */

function showDashboard(){

  document.getElementById("loginPage").style.display = "none";

  document.getElementById("dashboard").style.display = "block";

  loadAllData();

}


/* =========================================
   LOGIN
========================================= */

async function loginAdmin(){

  const password =
    document.getElementById("adminPass").value.trim();

  const errorBox =
    document.getElementById("loginError");

  const button =
    document.getElementById("loginButton");


  errorBox.classList.add("d-none");

  if(!password){

    errorBox.textContent =
      "পাসওয়ার্ড লিখুন।";

    errorBox.classList.remove("d-none");

    return;

  }


  button.disabled = true;

  button.textContent = "Logging in...";


  try{

    const response = await axios.post(
      "/api/admin/login",
      {
        password: password
      }
    );


    if(response.data && response.data.token){

      token = response.data.token;

      localStorage.setItem(
        "adminToken",
        token
      );

      document.getElementById("adminPass").value = "";

      showDashboard();

    }else{

      throw new Error("Token missing");

    }


  }catch(error){

    errorBox.textContent =
      error.response?.data?.error ||
      "পাসওয়ার্ড ভুল হয়েছে।";

    errorBox.classList.remove("d-none");

  }


  button.disabled = false;

  button.textContent = "Login";

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

  localStorage.removeItem("adminToken");

  token = "";

  products = [];

  orders = [];

  showLogin();

}


/* =========================================
   LOAD ALL DATA
========================================= */

async function loadAllData(){

  await Promise.all([
    loadProducts(),
    loadOrders(),
    loadSettings()
  ]);

  updateStats();

}


/* =========================================
   AUTH ERROR
========================================= */

function handleAuthError(error){

  if(error.response && error.response.status === 401){

    localStorage.removeItem("adminToken");

    token = "";

    alert("আপনার Login session শেষ হয়েছে। আবার Login করুন।");

    showLogin();

    return true;

  }

  return false;

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  try{

    const response = await axios.get(
      "/api/admin/products",
      authConfig()
    );

    products = response.data || [];

    renderProducts();

    updateStats();

  }catch(error){

    if(handleAuthError(error)) return;

    document.getElementById("productList").innerHTML =
      `<div class="alert alert-danger">
        Product load করতে সমস্যা হয়েছে।
      </div>`;

  }

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

  const container =
    document.getElementById("productList");


  if(!products.length){

    container.innerHTML =
      `<div class="empty">
        কোনো Product নেই।
      </div>`;

    return;

  }


  let html = `

  <table class="table table-bordered table-hover">

    <thead class="table-dark">

      <tr>

        <th>Image</th>

        <th>Name</th>

        <th>Price</th>

        <th>Stock</th>

        <th>Category</th>

        <th>Featured</th>

        <th>Action</th>

      </tr>

    </thead>

    <tbody>
  `;


  products.forEach(function(product){

    const image =
      product.image
      ? product.image
      : "";


    html += `

      <tr>

        <td>

          ${
            image

            ? `<img
                 src="${escapeHtml(image)}"
                 class="product-image"
                 alt=""
               >`

            : `<div
                 class="product-image d-flex align-items-center justify-content-center"
               >
                 No Image
               </div>`
